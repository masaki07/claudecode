<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブロック崩し</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: #e94560;
      letter-spacing: 2px;
    }
    #info {
      display: flex;
      gap: 40px;
      margin-bottom: 10px;
      font-size: 1rem;
    }
    #info span { color: #a8dadc; }
    canvas {
      border: 2px solid #e94560;
      border-radius: 4px;
      background: #16213e;
      display: block;
    }
    #message {
      margin-top: 14px;
      font-size: 1rem;
      color: #a8dadc;
      min-height: 1.4em;
    }
  </style>
</head>
<body>
  <h1>ブロック崩し</h1>
  <div id="info">
    <div>スコア: <span id="score">0</span></div>
    <div>ライフ: <span id="lives">3</span></div>
  </div>
  <canvas id="gameCanvas" width="480" height="400"></canvas>
  <div id="message">スペースキーまたはクリックでスタート</div>
  <script src="main.js"></script>
</body>
</html>
